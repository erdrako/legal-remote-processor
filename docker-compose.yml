services:
  processor:
    image: ${LEXMAPA_PROCESSOR_IMAGE:-lexmapa/legal-remote-processor:local-ocr}
    build:
      context: .
      args:
        INSTALL_OCR: ${INSTALL_OCR:-true}
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "processor.main", "worker"]
